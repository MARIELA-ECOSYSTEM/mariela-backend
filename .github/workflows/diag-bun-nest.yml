# Fase 21.2.11-CI.3.1 — DIAGNÓSTICO TEMPORÁRIO (branch diag/ci-bun-nest-esm; NUNCA em main).
# Fase 21.2.11-CI.3.3 — tratamento de erros compatível com o `bash -eo pipefail` do Actions (ver biblioteca).
# Fase 21.2.11-CI.4   — validação comparativa do preload SÓ no commit 5b8ff3d, condições ALTERNADAS:
#   E4 (import do AppModule) 30 sem × 30 com preload; E6 (spec isolado) 30 × 30; E7 (suíte completa) 3 × 3.
#   O preload é temporário (criado no runner, nunca versionado) e importa SOMENTE @nestjs/common e @nestjs/core.
#   A versão CI.3.3 deste arquivo (matriz 5b8ff3d × f174059, E1–E7) está preservada no commit b9e9f92.
# Sem segredos reais; MongoDB descartável dentro do runner; nada de Atlas/Render/27118.
name: diag-bun-nest

on:
  workflow_dispatch:
  push:
    branches: [diag/ci-bun-nest-esm]

permissions:
  contents: read

concurrency:
  group: diag-bun-nest
  cancel-in-progress: false

jobs:
  diag:
    name: diag-ci4 preload-${{ matrix.rotulo }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - rotulo: 5b8ff3d
            ref: 5b8ff3d0c9568f6071861d6136e61862cd96c53e

    # Idêntico ao ci.yml (valores FICTÍCIOS, só para o validateEnv).
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/mariela_test?replicaSet=rs0
      MONGODB_URI_TESTE: mongodb://127.0.0.1:27017/mariela_test?replicaSet=rs0
      MONGODB_URI_PROVA_TRANSACAO: mongodb://127.0.0.1:27017/mariela_ci_prova_transacao?replicaSet=rs0
      MONGODB_URI_E2E_F04: mongodb://127.0.0.1:27017/mariela_e2e_f04?replicaSet=rs0
      JWT_ACCESS_SECRET: ci-fake-jwt-access-secret-nunca-usar-fora-do-runner
      JWT_REFRESH_SECRET: ci-fake-jwt-refresh-secret-nunca-usar-fora-do-runner
      PDV_JWT_ACCESS_SECRET: ci-fake-pdv-access-secret-nunca-usar-fora-do-runner
      PDV_JWT_REFRESH_SECRET: ci-fake-pdv-refresh-secret-nunca-usar-fora-do-runner
      CORS_ORIGINS: ""
      SWAGGER_ENABLED: "false"

    steps:
      - name: Checkout do commit da matriz (o workflow vem da branch diag; o código, do ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - name: Confirma o commit (e define a pasta de saída FORA do checkout)
        shell: bash
        run: |
          set -euo pipefail
          SAIDA="$RUNNER_TEMP/diag-out"; echo "SAIDA=$SAIDA" >> "$GITHUB_ENV"
          mkdir -p "$SAIDA"
          test "$(git rev-parse HEAD)" = "${{ matrix.ref }}"
          git rev-parse HEAD | tee "$SAIDA/commit.txt"
          git status --porcelain | tee "$SAIDA/git-status-inicial.txt"

      # Igual ao passo "MongoDB 7 — replica set de 1 nó" do ci.yml (mesma imagem, rs0, host 127.0.0.1:27017).
      - name: MongoDB 7 — replica set de 1 nó (descartável)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mongodb -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          esperar() {
            for tentativa in $(seq 1 60); do
              if [ "$(docker exec mongodb mongosh --quiet --eval "$2" 2>/dev/null || true)" = "true" ]; then
                echo "$1: pronto (tentativa $tentativa)"; return 0
              fi
              sleep 2
            done
            echo "::error::$1: não ficou pronto em 120 s"; docker logs --tail 50 mongodb; return 1
          }
          esperar "ping" 'db.adminCommand({ ping: 1 }).ok === 1'
          docker exec mongodb mongosh --quiet --eval 'printjson(rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] }))'
          esperar "primário gravável" 'db.hello().isWritablePrimary === true'
          docker exec mongodb mongosh --quiet --eval 'db.version()' | tee "$SAIDA/mongo-versao.txt"

      - name: Bun 1.4.2 (igual ao ci.yml)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Dependências congeladas + inventário
        shell: bash
        run: |
          set -euo pipefail
          sha256sum bun.lock | tee "$SAIDA/lock-antes.sha256"
          bun install --frozen-lockfile 2>&1 | tee "$SAIDA/install.txt"
          sha256sum bun.lock | tee "$SAIDA/lock-depois.sha256"
          diff <(cut -d' ' -f1 "$SAIDA/lock-antes.sha256") <(cut -d' ' -f1 "$SAIDA/lock-depois.sha256")
          git diff --exit-code -- bun.lock package.json
          {
            echo "bun=$(bun --version) revision=$(bun --revision)"
            echo "node=$(node --version 2>/dev/null || echo ausente)"
            echo "uname=$(uname -a)"
            . /etc/os-release && echo "os=$PRETTY_NAME"
            echo "imagem=${ImageOS:-?}/${ImageVersion:-?} runner=${RUNNER_OS:-?}/${RUNNER_ARCH:-?}"
            for p in @nestjs/common @nestjs/core @nestjs/throttler @nestjs/testing @nestjs/config @nestjs/jwt @nestjs/mongoose reflect-metadata rxjs file-type load-esm; do
              v=$(bun -e "try{console.log(require('./node_modules/$p/package.json').version)}catch{console.log('ausente')}")
              echo "$p=$v"
            done
            # awk (não grep||echo): ausência do texto ⇒ "?"; arquivo ilegível ⇒ erro real (aborta o passo).
            echo "pacotes_instalados=$(awk 'match($0, /[0-9]+ packages installed/) { print substr($0, RSTART, RLENGTH); f = 1; exit } END { if (!f) print "?" }' "$SAIDA/install.txt")"
          } | tee "$SAIDA/ambiente.txt"
          # Sem `|| true`: o código de saída do `bun pm ls` é REGISTRADO (informativo; não interrompe).
          if bun pm ls --all > "$SAIDA/bun-pm-ls-all.txt" 2>&1; then rc=0; else rc=$?; fi
          echo "bun_pm_ls_exit=$rc linhas_bun_pm_ls_all=$(wc -l < "$SAIDA/bun-pm-ls-all.txt")" | tee -a "$SAIDA/ambiente.txt"

      # Biblioteca SEGURA sob o `bash --noprofile --norc -eo pipefail` do Actions (CI.3.3): todo retorno não zero
      # esperado é capturado com `if …; then …; else cod=$?; fi`; extrações com awk; falhas do PRÓPRIO harness são
      # contadas em ERROS_HARNESS e reprovam o passo só NO FIM. CI.4: coluna `condicao` (sem/com preload) e
      # extração do resumo e do primeiro erro completo da suíte.
      - name: Biblioteca de execução e classificação
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/diag-lib.sh" <<'LIB'
          ERROS_HARNESS=0
          ULTIMO_BASE=""
          ULTIMA_CLASSE=""
          ULTIMO_EXIT=""
          ULTIMO_MS=""
          ULTIMO_MODULO=""

          # Acrescenta uma linha a um arquivo de registro; falha de escrita = erro do harness (não aborta).
          registrar_em() { # $1 arquivo, $2 linha
            if printf '%s\n' "$2" >> "$1"; then printf '%s\n' "$2"; else
              echo "::error::falha ao registrar em $1: $2"; ERROS_HARNESS=$((ERROS_HARNESS + 1)); fi
          }
          registrar() { registrar_em "$SAIDA/tentativas.tsv" "$1"; }
          garantir_tsv() {
            if [ ! -f "$SAIDA/tentativas.tsv" ]; then
              printf 'experimento\ttentativa\tcondicao\tclasse\texit\tms\tmodulo_async\tnota\n' > "$SAIDA/tentativas.tsv"; fi
          }

          # Classe de UMA tentativa (sempre retorna 0). Ordem: TIMEOUT; saída não gravada ⇒ OPERACIONAL;
          # "require() async module" ⇒ ESM_CJS (mesmo com exit 0); grep ilegível (2) ⇒ OPERACIONAL; exit 0 ⇒
          # APROVADO; "(fail)" ou "N fail" (N>0) ⇒ FALHA_TESTE; senão OPERACIONAL.
          classificar() { # $1 exit, $2 stdout, $3 stderr
            local cod=$1 out=$2 err=$3 r
            if [ "$cod" -eq 124 ] || [ "$cod" -eq 137 ]; then echo TIMEOUT; return 0; fi
            if [ ! -f "$out" ] || [ ! -f "$err" ]; then echo OPERACIONAL; return 0; fi
            if grep -q 'require() async module' "$out" "$err"; then r=0; else r=$?; fi
            if [ "$r" -eq 0 ]; then echo ESM_CJS; return 0; fi
            if [ "$r" -ge 2 ]; then echo OPERACIONAL; return 0; fi
            if [ "$cod" -eq 0 ]; then echo APROVADO; return 0; fi
            if grep -Eq '^\(fail\)|^ *[1-9][0-9]* fail$' "$out" "$err"; then r=0; else r=$?; fi
            if [ "$r" -eq 0 ]; then echo FALHA_TESTE; else echo OPERACIONAL; fi
          }

          # Extrações com awk (retorna 0 sem correspondência; ≠0 só se o arquivo não puder ser lido).
          modulo_async() { awk 'match($0, /require\(\) async module "[^"]*/) { s = substr($0, RSTART, RLENGTH); sub(/.*node_modules\//, "", s); print s; exit }' "$@"; }
          # Resumo do `bun test`: pass, fail, skip, errors, total ("Ran N tests") e arquivos ("across M files").
          # "-" = linha ausente na saída (não é zero).
          resumo_suite() { awk 'BEGIN { p = f = s = e = t = a = "-" }
            { l = $0; sub(/^.*##\[[a-z]+\]/, "", l) }
            l ~ /^ *[0-9]+ pass$/ { split(l, x, " "); p = x[1] }
            l ~ /^ *[0-9]+ fail$/ { split(l, x, " "); f = x[1] }
            l ~ /^ *[0-9]+ skip$/ { split(l, x, " "); s = x[1] }
            l ~ /^ *[0-9]+ errors?$/ { split(l, x, " "); e = x[1] }
            l ~ /^Ran [0-9]+ tests? across [0-9]+ files?/ { split(l, x, " "); t = x[2]; a = x[5] }
            END { printf "%s\t%s\t%s\t%s\t%s\t%s", p, f, s, e, t, a }' "$@"; }
          # Último arquivo de teste anunciado antes do 1º erro (o bun no Actions prefixa com ##[group]).
          primeiro_arquivo_erro() { awk '/[A-Za-z0-9_.\/-]+\.(spec|test)\.ts:$/ { a = $0; sub(/^.*group\]/, "", a); sub(/:$/, "", a) }
            /require\(\) async module|^\(fail\)|^error:|^# Unhandled error/ { print a; exit }' "$@"; }
          # Primeiro erro COMPLETO (linha do erro + até 80 linhas de stack/contexto), com o arquivo anunciado antes.
          primeiro_erro() { awk 'n && FNR == 1 { exit }
            /[A-Za-z0-9_.\/-]+\.(spec|test)\.ts:$/ { a = $0 }
            !n && /require\(\) async module|^\(fail\)|^error:|^# Unhandled error/ { n = 1; print "arquivo anunciado antes: " a; print "fonte: " FILENAME ":" FNR }
            n && c < 81 { print; c++ }
            c >= 81 { exit }' "$@"; }

          # Uma tentativa em processo novo: exit code, duração, stdout e stderr SEPARADOS, classe e módulo.
          executar() { # $1 experimento, $2 condicao, $3 i, $4 timeout(s), resto = comando
            local exp=$1 cond=$2 i=$3 lim=$4; shift 4
            local dir="$SAIDA/$exp/$cond" base cod ini fim classe modulo="-" nota="-"
            ULTIMO_BASE=""; ULTIMA_CLASSE=OPERACIONAL; ULTIMO_EXIT=-1; ULTIMO_MS=0; ULTIMO_MODULO="-"
            if ! mkdir -p "$dir"; then
              ERROS_HARNESS=$((ERROS_HARNESS + 1))
              registrar "$(printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s' "$exp" "$i" "$cond" OPERACIONAL -1 0 - sem_pasta_de_saida)"; return 0
            fi
            base="$dir/$i"; ULTIMO_BASE=$base
            if ! printf '%s\n' "$*" > "$base.cmd"; then nota=cmd_nao_gravado; ERROS_HARNESS=$((ERROS_HARNESS + 1)); fi
            ini=$(date +%s%N)
            if timeout --kill-after=10 "$lim" "$@" >"$base.stdout" 2>"$base.stderr"; then cod=0; else cod=$?; fi
            fim=$(date +%s%N)
            classe=$(classificar "$cod" "$base.stdout" "$base.stderr")
            if [ ! -f "$base.stdout" ] || [ ! -f "$base.stderr" ]; then nota=saida_nao_gravada; ERROS_HARNESS=$((ERROS_HARNESS + 1)); fi
            if [ "$classe" = ESM_CJS ]; then
              if modulo=$(modulo_async "$base.stderr" "$base.stdout"); then :; else modulo=ERRO_EXTRACAO; fi
            fi
            ULTIMA_CLASSE=$classe; ULTIMO_EXIT=$cod; ULTIMO_MS=$(( (fim - ini) / 1000000 )); ULTIMO_MODULO=${modulo:--}
            registrar "$(printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s' "$exp" "$i" "$cond" "$classe" "$cod" "$ULTIMO_MS" "$ULTIMO_MODULO" "$nota")"
          }

          # Reprova o passo SÓ por erro do próprio harness, e só depois de rodar tudo.
          finalizar() {
            if [ "$ERROS_HARNESS" -gt 0 ]; then echo "::error::$ERROS_HARNESS erro(s) do próprio harness (ver tentativas.tsv)"; return 1; fi
            echo "harness sem erros"
          }
          LIB
          bash -n "$RUNNER_TEMP/diag-lib.sh"
          cp "$RUNNER_TEMP/diag-lib.sh" "$SAIDA/diag-lib.sh.txt"

      # O mecanismo de preload é PROVADO no próprio runner antes de qualquer experimento, com controle negativo:
      # um marcador temporário define uma global; o código só a enxerga se o preload rodou ANTES dele.
      # Depois, cria o preload REAL (só os dois imports) — o mesmo conteúdo do diagnóstico #2.
      - name: Verifica o mecanismo de preload (bun -e e bun test) e cria o preload temporário
        id: verifica
        shell: bash
        run: |
          set -euo pipefail
          V="$SAIDA/verificacao-preload.txt"
          printf 'globalThis.__DIAG_PRELOAD = 1;\n' > diag-preload-marcador.ts
          printf 'import { test, expect } from "bun:test";\ntest("preload aplicado antes do spec", () => { expect((globalThis as any).__DIAG_PRELOAD).toBe(1); });\n' > diag-preload-verifica.spec.ts
          sonda() { # $1 rótulo, $2 exit esperado, resto = comando
            local rot=$1 esp=$2 cod; shift 2
            if "$@" >> "$V" 2>&1; then cod=0; else cod=$?; fi
            echo "$rot: exit=$cod esperado=$esp" | tee -a "$V"
            [ "$cod" -eq "$esp" ]
          }
          ok=1
          sonda "bun -e COM --preload"   0 bun --preload ./diag-preload-marcador.ts -e 'process.exit(globalThis.__DIAG_PRELOAD === 1 ? 0 : 3)' || ok=0
          sonda "bun -e SEM preload"     3 bun -e 'process.exit(globalThis.__DIAG_PRELOAD === 1 ? 0 : 3)' || ok=0
          sonda "bun test COM --preload" 0 bun test --preload ./diag-preload-marcador.ts ./diag-preload-verifica.spec.ts || ok=0
          sonda "bun test SEM preload"   1 bun test ./diag-preload-verifica.spec.ts || ok=0
          rm -f diag-preload-marcador.ts diag-preload-verifica.spec.ts
          test ! -e diag-preload-marcador.ts && test ! -e diag-preload-verifica.spec.ts
          if [ "$ok" -ne 1 ]; then echo "::error::mecanismo de preload NÃO comprovado no runner — experimentos com preload seriam inválidos"; exit 1; fi
          printf 'import "@nestjs/common";\nimport "@nestjs/core";\n' > diag-preload.ts
          cp diag-preload.ts "$SAIDA/diag-preload.ts.txt"
          sha256sum diag-preload.ts | tee -a "$V"
          # Registro (não bloqueia): o esperado é só "?? diag-preload.ts"; a integridade é EXIGIDA no passo de remoção.
          git status --porcelain | tee "$SAIDA/git-status-com-preload.txt"

      # E4 e E6: 30 pares ALTERNADOS (sem, com, sem, com…) em processo novo, para que a variação do runner ao longo
      # do tempo afete as duas condições igualmente.
      - name: E4 — import do AppModule, 30 sem × 30 com preload (alternado)
        if: ${{ !cancelled() && steps.verifica.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/diag-lib.sh"
          garantir_tsv
          for i in $(seq 1 30); do
            executar E4-appmodule sem "$i" 120 bun -e 'await import("./src/app.module.ts"); console.log("ok")'
            executar E4-appmodule com "$i" 120 bun --preload ./diag-preload.ts -e 'await import("./src/app.module.ts"); console.log("ok")'
          done
          finalizar

      - name: E6 — spec isolado, 30 sem × 30 com preload (alternado)
        if: ${{ !cancelled() && steps.verifica.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/diag-lib.sh"
          garantir_tsv
          for i in $(seq 1 30); do
            executar E6-spec sem "$i" 300 bun test src/app.module.spec.ts
            executar E6-spec com "$i" 300 bun test --preload ./diag-preload.ts src/app.module.spec.ts
          done
          finalizar

      # E7: sem, com, sem, com, sem, com — mesmo comando do ci.yml (`bun test`), com/sem o --preload.
      - name: E7 — suíte completa, 3 sem × 3 com preload (alternado)
        if: ${{ !cancelled() && steps.verifica.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/diag-lib.sh"
          garantir_tsv
          R="$SAIDA/E7-suite/resumo.tsv"
          # Falha ao preparar o resumo = erro do harness; as execuções rodam mesmo assim (saídas ficam no tentativas.tsv).
          if ! { mkdir -p "$SAIDA/E7-suite" && printf 'execucao\tcondicao\ttentativa\tclasse\texit\tms\tpass\tfail\tskip\terrors\ttotal\tarquivos\tmodulo_async\tarquivo_1o_erro\n' > "$R"; }; then
            echo "::error::não foi possível preparar $R"; ERROS_HARNESS=$((ERROS_HARNESS + 1))
          fi
          n=0
          for i in 1 2 3; do
            for cond in sem com; do
              n=$((n + 1))
              if [ "$cond" = sem ]; then
                executar E7-suite sem "$i" 900 bun test
              else
                executar E7-suite com "$i" 900 bun test --preload ./diag-preload.ts
              fi
              r=$(printf -- '-\t-\t-\t-\t-\t-'); p="-"
              if [ -n "$ULTIMO_BASE" ]; then
                if r=$(resumo_suite "$ULTIMO_BASE.stdout" "$ULTIMO_BASE.stderr"); then :; else r=ERRO_EXTRACAO; ERROS_HARNESS=$((ERROS_HARNESS + 1)); fi
                if p=$(primeiro_arquivo_erro "$ULTIMO_BASE.stderr" "$ULTIMO_BASE.stdout"); then :; else p=ERRO_EXTRACAO; ERROS_HARNESS=$((ERROS_HARNESS + 1)); fi
                if primeiro_erro "$ULTIMO_BASE.stderr" "$ULTIMO_BASE.stdout" > "$ULTIMO_BASE.primeiro-erro.txt"; then :; else ERROS_HARNESS=$((ERROS_HARNESS + 1)); fi
              fi
              registrar_em "$R" "$(printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s' "$n" "$cond" "$i" "$ULTIMA_CLASSE" "$ULTIMO_EXIT" "$ULTIMO_MS" "$r" "$ULTIMO_MODULO" "${p:--}")"
            done
          done
          finalizar

      - name: Remove o preload temporário e confirma o repositório intacto
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f diag-preload.ts diag-preload-marcador.ts diag-preload-verifica.spec.ts
          git status --porcelain | tee "$SAIDA/git-status-final.txt"
          sha256sum bun.lock | tee "$SAIDA/lock-final.sha256"
          test -z "$(git status --porcelain)"
          diff <(cut -d' ' -f1 "$SAIDA/lock-antes.sha256") <(cut -d' ' -f1 "$SAIDA/lock-final.sha256")

      - name: Resumo por experimento e condição
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SAIDA="${SAIDA:-$RUNNER_TEMP/diag-out}"
          if [ ! -f "$SAIDA/tentativas.tsv" ]; then echo "sem tentativas registradas"; exit 0; fi
          awk -F'\t' 'NR > 1 { k = $1 " " $3 " " $4; n[k]++ } END { for (k in n) print k, n[k] }' "$SAIDA/tentativas.tsv" | sort | tee "$SAIDA/RESUMO.txt"
          {
            echo "## diag-ci4 preload ${{ matrix.rotulo }}"
            echo '```'
            for f in "$SAIDA/ambiente.txt" "$SAIDA/verificacao-preload.txt" "$SAIDA/RESUMO.txt" "$SAIDA/E7-suite/resumo.tsv" "$SAIDA/git-status-final.txt"; do
              if [ -f "$f" ]; then echo "### $(basename "$f")"; cat "$f"; else echo "(ausente: $(basename "$f"))"; fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artefatos (sempre; sem segredos — só valores fictícios do próprio workflow)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-ci4-preload-${{ matrix.rotulo }}
          path: ${{ runner.temp }}/diag-out/
          retention-days: 7
          if-no-files-found: warn

      - name: Limpeza do MongoDB descartável
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Sem `|| true`: remove só se o contêiner existir; falha real da remoção reprova este passo.
          # Falha do próprio `docker ps` é erro real (não vira "inexistente").
          if ! nomes=$(docker ps -a --format '{{.Names}}'); then echo "::error::docker ps falhou"; exit 1; fi
          if printf '%s\n' "$nomes" | awk '$0 == "mongodb" { f = 1 } END { exit !f }'; then
            docker rm -f mongodb
          else
            echo "contêiner mongodb inexistente (nada a remover)"
          fi
