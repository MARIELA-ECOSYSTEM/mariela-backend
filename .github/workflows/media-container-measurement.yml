name: Medição de mídia na imagem de produção

# Fase 60.4.3.4.4 — medição operacional da validação estrutural de mídias DENTRO da imagem Docker de produção, com
# limite de 512 MiB. Workflow MANUAL e ISOLADO:
#   - só `workflow_dispatch` (nunca roda em push/PR);
#   - constrói a imagem com o `Dockerfile` do repositório SEM alterações e NÃO publica em registry;
#   - rede Docker `--internal` (sem saída para a internet): só a API, um MongoDB descartável e a sonda;
#   - nenhum secret do GitHub; ambiente 100% fictício; nenhum acesso a banco, R2, Redis ou APIs de produção; sem deploy;
#   - o R2 é substituído por um storage em memória pelo harness (`.github/media-measurement/harness.ts`), sem alterar
#     o código da aplicação.
# Resultados: artifact `medicao-docker-<run_id>` (resultado.json, sonda.ndjson, logs, ambiente, docker stats).
on:
  workflow_dispatch:
    inputs:
      cpus:
        description: "Limite de CPU do contêiner (docker --cpus). Padrão 0.5 = premissa a confirmar para a instância de 512 MiB do Render."
        required: true
        default: "0.5"
      memoria:
        description: "Limite de memória do contêiner (docker --memory e --memory-swap; sem swap)."
        required: true
        default: "512m"

permissions:
  contents: read

concurrency:
  group: medicao-midia-docker
  cancel-in-progress: false

jobs:
  medir:
    name: Medir validação de mídia (imagem de produção, ${{ inputs.memoria }}, ${{ inputs.cpus }} CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGEM: mariela-backend:medicao-${{ github.sha }}
      REDE: medicao-midia
      SAIDA: ${{ github.workspace }}/saida
      MEDICAO: ${{ github.workspace }}/.github/media-measurement
      LIMITE_MEMORIA: ${{ inputs.memoria }}
      LIMITE_CPU: ${{ inputs.cpus }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ambiente do runner
        run: |
          mkdir -p "$SAIDA/arquivos" && chmod -R 777 "$SAIDA"
          {
            echo "commit=${GITHUB_SHA}"
            echo "--- uname"; uname -a
            echo "--- os-release"; cat /etc/os-release
            echo "--- nproc"; nproc
            echo "--- free -m"; free -m
            echo "--- docker version"; docker version
            echo "--- docker info (cgroup)"; docker info --format 'CgroupVersion={{.CgroupVersion}} CgroupDriver={{.CgroupDriver}} Kernel={{.KernelVersion}} OS={{.OperatingSystem}}'
          } | tee "$SAIDA/ambiente.txt"

      - name: Build da imagem de produção (Dockerfile sem alterações; sem push)
        run: |
          docker build --pull -t "$IMAGEM" . 2>&1 | tee "$SAIDA/docker-build.log"
          {
            echo "--- imagem"; docker image inspect "$IMAGEM" --format 'Id={{.Id}} Size={{.Size}} User={{.Config.User}} Cmd={{json .Config.Cmd}}'
            echo "--- base oven/bun:1.4.2-slim"; docker image inspect oven/bun:1.4.2-slim --format 'RepoDigests={{json .RepoDigests}}'
            echo "--- bun na imagem"; docker run --rm --network none "$IMAGEM" bun --version
            echo "--- os da imagem"; docker run --rm --network none "$IMAGEM" cat /etc/os-release
            echo "--- concorrência e prazo compilados"; docker run --rm --network none "$IMAGEM" grep -E "CONCORRENCIA_VALIDACAO_MIDIA =|PRAZO_VALIDACAO_MIDIA_MS =" /app/dist/modules/media/validacao/validacao-midia.constants.js
          } | tee -a "$SAIDA/ambiente.txt"

      - name: Rede isolada, MongoDB descartável e ambiente fictício
        run: |
          docker pull mongo:7
          docker network create --internal "$REDE"
          docker run -d --name mongo-medicao --network "$REDE" mongo:7
          # Valores FICTÍCIOS (nenhum secret). Segredos JWT com >= 32 caracteres porque NODE_ENV=production os exige.
          cat > "$RUNNER_TEMP/medicao.env" <<'EOF'
          NODE_ENV=production
          PORT=3000
          MONGODB_URI=mongodb://mongo-medicao:27017/mariela_medicao
          JWT_ACCESS_SECRET=medicao-ficticio-jwt-access-0123456789abcdef
          JWT_REFRESH_SECRET=medicao-ficticio-jwt-refresh-0123456789abcdef
          PDV_JWT_ACCESS_SECRET=medicao-ficticio-pdv-access-0123456789abcdef
          PDV_JWT_REFRESH_SECRET=medicao-ficticio-pdv-refresh-0123456789abcdef
          CORS_ORIGINS=
          SWAGGER_ENABLED=false
          R2_ACCOUNT_ID=0123456789abcdef0123456789abcdef
          R2_ACCESS_KEY_ID=MEDICAOFICTICIO
          R2_SECRET_ACCESS_KEY=medicao-ficticio-nao-e-segredo
          R2_BUCKET_NAME=medicao-ficticio
          R2_PUBLIC_BASE_URL=https://midia.medicao.invalid
          BUN_RUNTIME_TRANSPILER_CACHE_PATH=0
          EOF
          sed -i 's/^ *//' "$RUNNER_TEMP/medicao.env"

      - name: Gerar arquivos representativos (dentro da imagem, sem rede)
        run: |
          docker run --rm --network none \
            -v "$MEDICAO:/app/medicao:ro" -v "$GITHUB_WORKSPACE/src/test-utils/fixtures/midia:/fixtures:ro" -v "$SAIDA:/saida" \
            -e BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 \
            "$IMAGEM" bun --no-env-file /app/medicao/gerar-arquivos.ts /fixtures /saida/arquivos
          cp "$SAIDA/arquivos/manifesto.json" "$SAIDA/manifesto-arquivos.json"

      - name: Cenário 1 — API em repouso com o CMD ORIGINAL da imagem (bun dist/main.js)
        run: |
          docker run -d --name api-repouso --network "$REDE" --no-healthcheck \
            --memory="$LIMITE_MEMORIA" --memory-swap="$LIMITE_MEMORIA" --cpus="$LIMITE_CPU" \
            --env-file "$RUNNER_TEMP/medicao.env" "$IMAGEM"
          pronta=0
          for i in $(seq 1 60); do
            if docker run --rm --network "$REDE" "$IMAGEM" bun -e "fetch('http://api-repouso:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then pronta=1; break; fi
            sleep 2
          done
          echo "pronta=$pronta" | tee "$SAIDA/cenario1.txt"
          sleep 30
          for i in $(seq 1 6); do
            {
              echo "--- amostra $i $(date -u +%FT%T.%3NZ)"
              docker exec api-repouso sh -c 'echo memory.current=$(cat /sys/fs/cgroup/memory.current); echo memory.peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null); grep -E "^(anon|file|shmem) " /sys/fs/cgroup/memory.stat; cat /sys/fs/cgroup/memory.events; grep -E "^(VmRSS|VmHWM)" /proc/1/status'
              docker stats --no-stream --format 'docker-stats {{.MemUsage}} {{.CPUPerc}}' api-repouso
            } | tee -a "$SAIDA/cenario1.txt"
            sleep 5
          done
          docker inspect api-repouso --format '{{json .State}}' > "$SAIDA/cenario1-estado.json"
          docker logs api-repouso > "$SAIDA/cenario1-api.log" 2>&1 || true
          docker rm -f api-repouso

      - name: Cenários 2 a 6 — harness na imagem (API do dist + validações + falhas + sonda de saúde)
        run: |
          docker run -d --name sonda --network "$REDE" \
            -v "$MEDICAO:/app/medicao:ro" -v "$SAIDA:/saida" -e BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 \
            "$IMAGEM" bun --no-env-file /app/medicao/sonda-health.ts http://api-medicao:3000/health /saida/sonda.ndjson
          docker run -d --name api-medicao --network "$REDE" --no-healthcheck \
            --memory="$LIMITE_MEMORIA" --memory-swap="$LIMITE_MEMORIA" --cpus="$LIMITE_CPU" \
            --env-file "$RUNNER_TEMP/medicao.env" \
            -e MEDICAO_DIST=/app/dist -e MEDICAO_ARQUIVOS=/saida/arquivos -e MEDICAO_SAIDA=/saida -e MEDICAO_SONDA=/saida/sonda.ndjson \
            -v "$MEDICAO:/app/medicao:ro" -v "$SAIDA:/saida" \
            "$IMAGEM" bun --no-env-file /app/medicao/harness.ts
          ( while [ "$(docker inspect -f '{{.State.Running}}' api-medicao 2>/dev/null)" = "true" ]; do
              docker stats --no-stream --format "$(date -u +%T) {{.MemUsage}} {{.CPUPerc}}" api-medicao >> "$SAIDA/docker-stats-api-medicao.txt" 2>/dev/null || true
              sleep 2
            done ) &
          codigo=$(timeout 1500 docker wait api-medicao || echo "timeout")
          echo "codigo_saida_harness=$codigo" | tee "$SAIDA/cenarios-2-6.txt"
          docker inspect api-medicao --format '{{json .State}}' > "$SAIDA/api-medicao-estado.json"
          docker inspect api-medicao --format 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} RestartCount={{.RestartCount}}' | tee -a "$SAIDA/cenarios-2-6.txt"
          docker logs api-medicao > "$SAIDA/api-medicao.log" 2>&1 || true
          docker rm -f sonda api-medicao || true
          test "$codigo" = "0"

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Medição de mídia — imagem de produção (${LIMITE_MEMORIA}, ${LIMITE_CPU} CPU)"
            cat "$SAIDA/cenarios-2-6.txt" 2>/dev/null || true
            if [ -f "$SAIDA/resultado.json" ]; then
              echo '```'
              jq -r '"pico acumulado do contêiner: \(.memoriaPicoAcumuladoMiB) MiB | memory.events: \(.eventosMemoriaFinais|tojson)"' "$SAIDA/resultado.json"
              jq -r '.janelas[] | "\(.rotulo) | contêiner máx \(.containerMaxAmostradoMiB) MiB | API RSS máx \(.apiRssMaxMiB) MiB | subprocessos ativos máx \(.subprocessosAtivosMax) | \(.duracaoMs) ms | oom Δ \(.eventosMemoriaDelta.oom // 0) oom_kill Δ \(.eventosMemoriaDelta.oom_kill // 0)"' "$SAIDA/resultado.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpeza
        if: always()
        run: |
          docker rm -f sonda api-medicao api-repouso mongo-medicao 2>/dev/null || true
          docker network rm "$REDE" 2>/dev/null || true
          rm -f "$SAIDA"/arquivos/*.jpg "$SAIDA"/arquivos/*.png "$SAIDA"/arquivos/*.webp "$SAIDA"/arquivos/*.gif "$SAIDA"/arquivos/*.mp4 || true

      - name: Publicar resultados como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medicao-docker-${{ github.run_id }}
          path: saida/
          retention-days: 30
