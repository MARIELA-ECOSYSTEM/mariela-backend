name: Medição de mídia na imagem de produção

# Fase 60.4.3.4.4 — medição operacional da validação estrutural de mídias DENTRO da imagem Docker de produção, com
# limite de memória. Fase 60.4.3.4.5 — comparação COM e SEM o Docker HEALTHCHECK da imagem.
# Workflow MANUAL e ISOLADO:
#   - só `workflow_dispatch` (nunca roda em push/PR);
#   - constrói a imagem com o `Dockerfile` do repositório SEM alterações e NÃO publica em registry;
#   - cada cenário de HEALTHCHECK roda em SEQUÊNCIA, com rede, MongoDB e contêineres NOVOS (nada é reaproveitado);
#   - rede Docker `--internal` (sem saída para a internet): só a API, um MongoDB descartável e a sonda;
#   - nenhum secret do GitHub; ambiente 100% fictício; nenhum acesso a banco, R2, Redis ou APIs de produção; sem deploy;
#   - o R2 é substituído por um storage em memória pelo harness (`.github/media-measurement/harness.ts`), sem alterar
#     o código da aplicação.
# Cenário `sem_healthcheck`: API com `--no-healthcheck`. Cenário `com_healthcheck`: API SEM essa flag — o Docker executa
# o HEALTHCHECK definido no Dockerfile (não é sobrescrito). A sonda externa de `/health` roda nos DOIS cenários.
# Resultados: artifact `medicao-docker-<run_id>` (uma pasta por cenário + ambiente).
on:
  workflow_dispatch:
    inputs:
      cpus:
        description: "Limite de CPU do contêiner (docker --cpus). Informe o valor REAL da instância (Render Free = 0.1). O padrão 0.5 é só visual."
        required: true
        default: "0.5"
      memoria:
        description: "Limite de memória do contêiner (docker --memory e --memory-swap; sem swap). Instância atual: 512m."
        required: true
        default: "512m"
      healthcheck_mode:
        description: "Cenário do Docker HEALTHCHECK da imagem: sem_healthcheck, com_healthcheck ou ambos (em sequência)."
        required: true
        type: choice
        default: ambos
        options:
          - ambos
          - sem_healthcheck
          - com_healthcheck

permissions:
  contents: read

concurrency:
  group: medicao-midia-docker
  cancel-in-progress: false

jobs:
  medir:
    name: Medir mídia (${{ inputs.memoria }}, ${{ inputs.cpus }} CPU, ${{ inputs.healthcheck_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      IMAGEM: mariela-backend:medicao-${{ github.sha }}
      SAIDA: ${{ github.workspace }}/saida
      MEDICAO: ${{ github.workspace }}/.github/media-measurement
      LIMITE_MEMORIA: ${{ inputs.memoria }}
      LIMITE_CPU: ${{ inputs.cpus }}
      MODO_HEALTHCHECK: ${{ inputs.healthcheck_mode }}
      ROTULO: medicao-midia=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ambiente do runner e parâmetros
        run: |
          mkdir -p "$SAIDA/arquivos" && chmod -R 777 "$SAIDA"
          {
            echo "commit=${GITHUB_SHA}"
            echo "parametros: memoria=${LIMITE_MEMORIA} cpus=${LIMITE_CPU} healthcheck_mode=${MODO_HEALTHCHECK}"
            echo "--- uname"; uname -a
            echo "--- os-release"; cat /etc/os-release
            echo "--- nproc"; nproc
            echo "--- free -m"; free -m
            echo "--- docker version"; docker version
            echo "--- docker info (cgroup)"; docker info --format 'CgroupVersion={{.CgroupVersion}} CgroupDriver={{.CgroupDriver}} Kernel={{.KernelVersion}} OS={{.OperatingSystem}}'
          } | tee "$SAIDA/ambiente.txt"

      - name: Build da imagem de produção (Dockerfile sem alterações; sem push)
        run: |
          docker build --pull -t "$IMAGEM" . 2>&1 | tee "$SAIDA/docker-build.log"
          {
            echo "--- imagem"; docker image inspect "$IMAGEM" --format 'Id={{.Id}} Size={{.Size}} User={{.Config.User}} Cmd={{json .Config.Cmd}}'
            echo "--- HEALTHCHECK da imagem (durações em ns)"; docker image inspect "$IMAGEM" --format '{{json .Config.Healthcheck}}'
            echo "--- base oven/bun:1.4.2-slim"; docker image inspect oven/bun:1.4.2-slim --format 'RepoDigests={{json .RepoDigests}}'
            echo "--- bun na imagem"; docker run --rm --no-healthcheck --network none "$IMAGEM" bun --version
            echo "--- os da imagem"; docker run --rm --no-healthcheck --network none "$IMAGEM" cat /etc/os-release
            echo "--- concorrência e prazo compilados"; docker run --rm --no-healthcheck --network none "$IMAGEM" grep -E "CONCORRENCIA_VALIDACAO_MIDIA =|PRAZO_VALIDACAO_MIDIA_MS =" /app/dist/modules/media/validacao/validacao-midia.constants.js
          } | tee -a "$SAIDA/ambiente.txt"
          docker image inspect "$IMAGEM" --format '{{json .Config.Healthcheck}}' > "$SAIDA/healthcheck-imagem.json"

      - name: Ambiente fictício e imagem do MongoDB descartável
        run: |
          docker pull mongo:7
          # Valores FICTÍCIOS (nenhum secret). Segredos JWT com >= 32 caracteres porque NODE_ENV=production os exige.
          cat > "$RUNNER_TEMP/medicao.env" <<'EOF'
          NODE_ENV=production
          PORT=3000
          MONGODB_URI=mongodb://mongo-medicao:27017/mariela_medicao
          JWT_ACCESS_SECRET=medicao-ficticio-jwt-access-0123456789abcdef
          JWT_REFRESH_SECRET=medicao-ficticio-jwt-refresh-0123456789abcdef
          PDV_JWT_ACCESS_SECRET=medicao-ficticio-pdv-access-0123456789abcdef
          PDV_JWT_REFRESH_SECRET=medicao-ficticio-pdv-refresh-0123456789abcdef
          CORS_ORIGINS=
          SWAGGER_ENABLED=false
          R2_ACCOUNT_ID=0123456789abcdef0123456789abcdef
          R2_ACCESS_KEY_ID=MEDICAOFICTICIO
          R2_SECRET_ACCESS_KEY=medicao-ficticio-nao-e-segredo
          R2_BUCKET_NAME=medicao-ficticio
          R2_PUBLIC_BASE_URL=https://midia.medicao.invalid
          BUN_RUNTIME_TRANSPILER_CACHE_PATH=0
          EOF
          sed -i 's/^ *//' "$RUNNER_TEMP/medicao.env"

      - name: Verificar a contabilização do HEALTHCHECK (casos fixos, dentro da imagem, sem rede)
        run: |
          docker run --rm --no-healthcheck --network none --label "$ROTULO" \
            -v "$MEDICAO:/app/medicao:ro" -e BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 \
            "$IMAGEM" bun --no-env-file /app/medicao/verificar-healthcheck-log.ts | tee "$SAIDA/verificacao-healthcheck-log.txt"

      - name: Gerar arquivos representativos (dentro da imagem, sem rede)
        run: |
          docker run --rm --no-healthcheck --network none --label "$ROTULO" \
            -v "$MEDICAO:/app/medicao:ro" -v "$GITHUB_WORKSPACE/src/test-utils/fixtures/midia:/fixtures:ro" -v "$SAIDA:/saida" \
            -e BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 \
            "$IMAGEM" bun --no-env-file /app/medicao/gerar-arquivos.ts /fixtures /saida/arquivos
          cp "$SAIDA/arquivos/manifesto.json" "$SAIDA/manifesto-arquivos.json"

      - name: Cenários por modo de HEALTHCHECK (em sequência, infraestrutura nova a cada modo)
        run: |
          case "$MODO_HEALTHCHECK" in
            ambos) MODOS="sem_healthcheck com_healthcheck" ;;
            sem_healthcheck|com_healthcheck) MODOS="$MODO_HEALTHCHECK" ;;
            *) echo "healthcheck_mode inválido: $MODO_HEALTHCHECK"; exit 1 ;;
          esac
          falhas=0

          # Fase 60.4.3.4.7 — histórico do Docker HEALTHCHECK: `.State.Health.Log` guarda só as 5 últimas execuções, então
          # ele é consultado periodicamente (NDJSON { t, health }) e consolidado depois (healthcheck-log.ts). Com o
          # HEALTHCHECK desabilitado, `.State.Health` é null.
          # Fase 60.4.3.4.8 — falha de `docker inspect` é registrada como ERRO de leitura (campo `erro`), nunca como
          # `health: null` (que significa HEALTHCHECK desabilitado).
          # Fase 60.4.3.4.9.15 (R06) — cada leitura válida grava também `running`, `exitCode` e `finishedAt` (os dois
          # últimos só com o contêiner parado; em execução são null). A consolidação separa o estado OPERACIONAL
          # (running=true) do estado observado DEPOIS DA PARADA (running=false) e do estado do contêiner.
          amostrar_saude() {
            local t estado rodando codigo fim health
            t=$(date +%s%3N)
            # Uma única chamada obtém Running, ExitCode, FinishedAt e Health: evita uma segunda leitura que poderia falhar
            # sem registro. Health é o ÚLTIMO campo: um `|` dentro do JSON (ex.: no Output) não afeta a separação.
            if estado=$(docker inspect -f '{{.State.Running}}|{{.State.ExitCode}}|{{.State.FinishedAt}}|{{json .State.Health}}' "$1" 2>/dev/null); then
              rodando=${estado%%|*}; estado=${estado#*|}
              codigo=${estado%%|*}; estado=${estado#*|}
              fim=${estado%%|*}; health=${estado#*|}
              # Formato inesperado é ERRO de leitura (nunca vira running=false nem gera JSON inválido).
              if [ "$rodando" != "true" ] && [ "$rodando" != "false" ] || ! [[ "$codigo" =~ ^-?[0-9]+$ ]] || ! [[ "$fim" =~ ^[0-9T:.Z+-]+$ ]]; then
                printf '{"t":%s,"health":null,"erro":"docker inspect com formato inesperado"}\n' "$t" >> "$2"
                return 1
              fi
              if [ "$rodando" = "true" ]; then
                printf '{"t":%s,"running":true,"exitCode":null,"finishedAt":null,"health":%s}\n' "$t" "$health" >> "$2"
              else
                printf '{"t":%s,"running":false,"exitCode":%s,"finishedAt":"%s","health":%s}\n' "$t" "$codigo" "$fim" "$health" >> "$2"
              fi
              printf '%s' "$rodando"
            else
              printf '{"t":%s,"health":null,"erro":"docker inspect falhou"}\n' "$t" >> "$2"
              return 1
            fi
          }
          # Coletor periódico com parada COOPERATIVA: cria o arquivo-sinal e espera (`wait`) a iteração em curso terminar —
          # sem `kill` no meio de uma escrita, sem coletor vivo durante a coleta final e a consolidação.
          iniciar_coletor() {  # $1 contêiner, $2 ndjson, $3 sinal de parada, $4 intervalo (s), $5 (opcional) arquivo de docker stats
            rm -f "$3"
            # Fase 60.4.3.4.9 — Running e Health vêm da MESMA leitura do inspect feita por amostrar_saude.
            # Falha fica registrada no NDJSON e não encerra o coletor; teto de 30 falhas consecutivas.
            ( falhas_seguidas=0
              while [ ! -e "$3" ]; do
                if [ -n "${5:-}" ]; then docker stats --no-stream --format "$(date -u +%T) {{.MemUsage}} {{.CPUPerc}}" "$1" >> "$5" 2>/dev/null || true; fi
                if rodando=$(amostrar_saude "$1" "$2"); then
                  falhas_seguidas=0
                  [ "$rodando" = "true" ] || break
                else
                  falhas_seguidas=$((falhas_seguidas + 1))
                  [ "$falhas_seguidas" -le 30 ] || break
                fi
                sleep "$4"
              done ) &
            COLETOR_PID=$!
          }
          parar_coletor() { touch "$2"; wait "$1" 2>/dev/null || true; }
          # Consolidação SEM `|| true`: código ≠ 0 (inclusive integridade falha) é propagado e registrado como erro do modo.
          consolidar_saude() {  # $1 dir, $2 ndjson, $3 saída, $4 habilitado|desabilitado, $5 (opcional) resultado.json
            docker run --rm --no-healthcheck --network none --label "$ROTULO" \
              -v "$MEDICAO:/app/medicao:ro" -v "$1:/saida" -e BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 \
              "$IMAGEM" bun --no-env-file /app/medicao/healthcheck-log.ts "/saida/$2" "/saida/$3" "$4" ${5:+"/saida/$5"}
          }
          # Artefatos OBRIGATÓRIOS de cada modo: existem, não estão vazios e (os .json) são JSON válido.
          verificar_artefatos() {  # $1 dir
            local faltando=0 f
            for f in cenario1.txt cenario1-health.ndjson cenario1-healthcheck-consolidado.json sonda.ndjson resultado.json api-medicao-estado.json api-medicao-health.ndjson api-medicao-healthcheck-consolidado.json; do
              if [ ! -s "$1/$f" ]; then echo "::error::artefato obrigatório ausente ou vazio: $(basename "$1")/$f"; faltando=1
              elif [[ "$f" == *.json ]] && ! jq empty "$1/$f" 2>/dev/null; then echo "::error::artefato obrigatório com JSON inválido: $(basename "$1")/$f"; faltando=1
              fi
            done
            [ "$faltando" -eq 0 ]
          }

          executar_modo() {
            local modo="$1" dir="$SAIDA/$1" rede="medicao-$1" api1="api-repouso-$1" api2="api-medicao-$1" sonda="sonda-$1" mongo="mongo-$1"
            local flags_hc=() esperado=habilitado erro_modo=0 coletor rc
            if [ "$modo" = "sem_healthcheck" ]; then flags_hc=(--no-healthcheck); esperado=desabilitado; fi
            mkdir -p "$dir" && chmod 777 "$dir"
            echo "=== modo=$modo | flags de HEALTHCHECK na API: ${flags_hc[*]:-<nenhuma: HEALTHCHECK da imagem ativo>} | inicio=$(date -u +%FT%TZ)" | tee "$dir/modo.txt"

            docker network create --internal --label "$ROTULO" "$rede"
            docker run -d --name "$mongo" --label "$ROTULO" --network "$rede" --network-alias mongo-medicao mongo:7

            # ---- Cenário 1: API em repouso com o CMD ORIGINAL da imagem (bun dist/main.js) ----
            docker run -d --name "$api1" --label "$ROTULO" --network "$rede" "${flags_hc[@]}" \
              --memory="$LIMITE_MEMORIA" --memory-swap="$LIMITE_MEMORIA" --cpus="$LIMITE_CPU" \
              --env-file "$RUNNER_TEMP/medicao.env" "$IMAGEM"
            docker inspect "$api1" --format '{{json .Config.Healthcheck}}' > "$dir/cenario1-healthcheck-config.json"
            iniciar_coletor "$api1" "$dir/cenario1-health.ndjson" "$RUNNER_TEMP/parar-coletor1-$modo" 10
            coletor=$COLETOR_PID
            local pronta=0 inicio_boot
            inicio_boot=$(date +%s)
            for i in $(seq 1 120); do
              if docker run --rm --no-healthcheck --label "$ROTULO" --network "$rede" "$IMAGEM" bun -e "fetch('http://$api1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then pronta=1; break; fi
              sleep 2
            done
            echo "pronta=$pronta segundos_ate_pronta=$(( $(date +%s) - inicio_boot ))" | tee "$dir/cenario1.txt"
            sleep 30
            # 13 amostras × 5 s ≈ 65 s de repouso medido (≥ 60 s; ≥ 2 execuções do HEALTHCHECK de 30 s no modo com_healthcheck).
            for i in $(seq 1 13); do
              {
                echo "--- amostra $i $(date -u +%FT%T.%3NZ)"
                docker exec "$api1" sh -c 'echo memory.current=$(cat /sys/fs/cgroup/memory.current); echo memory.peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null); grep -E "^(anon|file|shmem) " /sys/fs/cgroup/memory.stat; cat /sys/fs/cgroup/memory.events; grep -E "^usage_usec" /sys/fs/cgroup/cpu.stat; grep -E "^(VmRSS|VmHWM)" /proc/1/status'
                docker stats --no-stream --format 'docker-stats {{.MemUsage}} {{.CPUPerc}}' "$api1"
              } >> "$dir/cenario1.txt"
              sleep 5
            done
            docker inspect "$api1" --format '{{json .State}}' > "$dir/cenario1-estado.json"
            docker inspect "$api1" --format 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} RestartCount={{.RestartCount}} Health={{if .State.Health}}{{.State.Health.Status}}/falhas={{.State.Health.FailingStreak}}/execucoes_no_log={{len .State.Health.Log}}{{else}}desabilitado{{end}}' | tee -a "$dir/cenario1.txt"
            docker logs "$api1" > "$dir/cenario1-api.log" 2>&1 || true
            # Ordem garantida: para o coletor (espera a iteração em curso) → amostra FINAL (contêiner ainda existe) → remove → consolida.
            parar_coletor "$coletor" "$RUNNER_TEMP/parar-coletor1-$modo"
            amostrar_saude "$api1" "$dir/cenario1-health.ndjson" >/dev/null
            docker rm -f "$api1"
            consolidar_saude "$dir" cenario1-health.ndjson cenario1-healthcheck-consolidado.json "$esperado"; rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::HEALTHCHECK $modo/cenario1: $( [ "$rc" -eq 2 ] && echo "integridade reprovada (código 2)" || echo "consolidação falhou (código $rc)")"; erro_modo=1
            fi

            # ---- Cenários 2 a 6: harness (API do dist + validações + falhas) e sonda externa de /health ----
            docker run -d --name "$sonda" --label "$ROTULO" --no-healthcheck --network "$rede" \
              -v "$MEDICAO:/app/medicao:ro" -v "$dir:/saida" -e BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 \
              "$IMAGEM" bun --no-env-file /app/medicao/sonda-health.ts "http://$api2:3000/health" /saida/sonda.ndjson
            docker run -d --name "$api2" --label "$ROTULO" --network "$rede" "${flags_hc[@]}" \
              --memory="$LIMITE_MEMORIA" --memory-swap="$LIMITE_MEMORIA" --cpus="$LIMITE_CPU" \
              --env-file "$RUNNER_TEMP/medicao.env" \
              -e MEDICAO_DIST=/app/dist -e MEDICAO_ARQUIVOS=/arquivos -e MEDICAO_SAIDA=/saida -e MEDICAO_SONDA=/saida/sonda.ndjson \
              -e MEDICAO_REPOUSO_MS=75000 -e MEDICAO_MODO="$modo" \
              -v "$MEDICAO:/app/medicao:ro" -v "$SAIDA/arquivos:/arquivos:ro" -v "$dir:/saida" \
              "$IMAGEM" bun --no-env-file /app/medicao/harness.ts
            docker inspect "$api2" --format '{{json .Config.Healthcheck}}' > "$dir/api-medicao-healthcheck-config.json"
            iniciar_coletor "$api2" "$dir/api-medicao-health.ndjson" "$RUNNER_TEMP/parar-coletor2-$modo" 2 "$dir/docker-stats-api-medicao.txt"
            coletor=$COLETOR_PID
            local codigo
            codigo=$(timeout 3000 docker wait "$api2" || echo "timeout")
            echo "codigo_saida_harness=$codigo" | tee "$dir/cenarios-2-6.txt"
            docker inspect "$api2" --format '{{json .State}}' > "$dir/api-medicao-estado.json"
            docker inspect "$api2" --format 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} RestartCount={{.RestartCount}} Health={{if .State.Health}}{{.State.Health.Status}}/falhas={{.State.Health.FailingStreak}}/execucoes_no_log={{len .State.Health.Log}}{{else}}desabilitado{{end}}' | tee -a "$dir/cenarios-2-6.txt"
            docker logs "$api2" > "$dir/api-medicao.log" 2>&1 || true
            parar_coletor "$coletor" "$RUNNER_TEMP/parar-coletor2-$modo"
            amostrar_saude "$api2" "$dir/api-medicao-health.ndjson" >/dev/null
            docker rm -f "$sonda" "$api2" "$mongo" || true
            consolidar_saude "$dir" api-medicao-health.ndjson api-medicao-healthcheck-consolidado.json "$esperado" resultado.json; rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::HEALTHCHECK $modo/api-medicao: $( [ "$rc" -eq 2 ] && echo "integridade reprovada (código 2)" || echo "consolidação falhou (código $rc)")"; erro_modo=1
            fi
            docker network rm "$rede" || true
            verificar_artefatos "$dir" || erro_modo=1
            echo "fim=$(date -u +%FT%TZ) codigo_harness=$codigo erro_instrumentacao=$erro_modo" >> "$dir/modo.txt"
            [ "$codigo" = "0" ] && [ "$erro_modo" -eq 0 ]
          }

          for modo in $MODOS; do
            if ! executar_modo "$modo"; then falhas=$((falhas + 1)); echo "::error::modo $modo terminou com falha (harness ou instrumentação; ver $modo/modo.txt e $modo/cenarios-2-6.txt)"; fi
          done
          test "$falhas" -eq 0

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Medição de mídia — imagem de produção (${LIMITE_MEMORIA}, ${LIMITE_CPU} CPU, ${MODO_HEALTHCHECK})"
            for dir in "$SAIDA"/sem_healthcheck "$SAIDA"/com_healthcheck; do
              [ -d "$dir" ] || continue
              echo "### $(basename "$dir")"
              echo '```'
              cat "$dir/cenario1.txt" 2>/dev/null | grep -E "^(pronta|OOMKilled)" || true
              cat "$dir/cenarios-2-6.txt" 2>/dev/null || true
              for c in cenario1 api-medicao; do
                f="$dir/$c-healthcheck-consolidado.json"
                if [ ! -f "$f" ]; then echo "ERRO: consolidado ausente ($c) — HEALTHCHECK sem medição válida neste modo"
                else jq -r --arg c "$c" '(if .integridade.ok then "" else "INTEGRIDADE REPROVADA: \(.integridade.problemas|join("; ")) | " end) + (if .habilitado then "HEALTHCHECK (\($c), histórico do Docker): execuções \(.execucoes) | sucessos \(.sucessos) | falhas \(.falhas) | prazo excedido \(.prazoExcedido) | duração ms \(.duracaoMs|tojson) | status operacional final \(.estadoOperacional.status) | failing streak operacional final \(.estadoOperacional.failingStreak) / máx \(.estadoOperacional.failingStreakMax) | após a parada \(.estadoAposParada.status // "não observado") | /proc (auxiliar): observadas \(.correlacaoProc.observadas), não observadas \(.correlacaoProc.naoObservadas), fora de janela \(.correlacaoProc.foraDeJanela)" else "HEALTHCHECK (\($c)): desabilitado" end) + " | contêiner: encerramento \(.container.encerramento), exitCode \(.container.exitCode)"' "$f" || echo "ERRO: consolidado ilegível ($c): $f"; fi
              done
              if [ -f "$dir/resultado.json" ]; then
                jq -r '"pico acumulado do contêiner: \(.memoriaPicoAcumuladoMiB) MiB | memory.events: \(.eventosMemoriaFinais|tojson)"' "$dir/resultado.json"
                jq -r '.janelas[] | "\(.rotulo) | contêiner máx \(.containerMaxAmostradoMiB) MiB | API RSS máx \(.apiRssMaxMiB) MiB | validadores máx \(.subprocessosAtivosMax) | HEALTHCHECK no /proc (auxiliar) \(.healthcheckDocker.execucoesVistas) (pico \(.healthcheckDocker.picoRssMiB) MiB) | \(.duracaoMs) ms | oom Δ \(.eventosMemoriaDelta.oom // 0) oom_kill Δ \(.eventosMemoriaDelta.oom_kill // 0)"' "$dir/resultado.json"
              fi
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpeza
        if: always()
        run: |
          docker ps -aq --filter "label=$ROTULO" | xargs -r docker rm -f || true
          docker network ls -q --filter "label=$ROTULO" | xargs -r docker network rm || true
          rm -f "$SAIDA"/arquivos/*.jpg "$SAIDA"/arquivos/*.png "$SAIDA"/arquivos/*.webp "$SAIDA"/arquivos/*.gif "$SAIDA"/arquivos/*.mp4 || true

      - name: Publicar resultados como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medicao-docker-${{ github.run_id }}
          path: saida/
          retention-days: 30
