# Etapa 18.23 — orquestração mínima para rodar o backend + MongoDB num único
# host (o cenário de implantação mais simples para a loja física: uma
# máquina/servidor único, sem necessidade de um cluster).
#
# Não substitui uma estratégia de backup: o volume nomeado `mongodb_data`
# persiste os dados no host, mas backup/retenção/teste de restore continuam
# sendo responsabilidade operacional (ver README.md, seção "Backup").
services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      # Etapa 28 — habilita autenticação na instância inteira. A imagem
      # oficial cria este usuário ROOT (banco `admin`, papel `root`) na
      # PRIMEIRA inicialização com o data directory vazio; nunca reaplicado
      # depois. Só para administração (backup, criação de outros usuários) —
      # a aplicação NUNCA se conecta com este usuário (ver `api.environment
      # .MONGODB_URI` abaixo, que usa o usuário de aplicação criado pelo
      # script em ./docker/mongo-init). Valores vêm só do .env real do
      # servidor — nunca hardcoded aqui.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?defina MONGO_INITDB_ROOT_USERNAME no .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?defina MONGO_INITDB_ROOT_PASSWORD no .env}
      # Lidas só pelo script de init abaixo (nunca pela imagem em si) — cria
      # o usuário de APLICAÇÃO, escopado unicamente ao banco `mariela`, com
      # o papel mínimo (`readWrite`, nunca root).
      MARIELA_APP_MONGO_USER: ${MARIELA_APP_MONGO_USER:?defina MARIELA_APP_MONGO_USER no .env}
      MARIELA_APP_MONGO_PASSWORD: ${MARIELA_APP_MONGO_PASSWORD:?defina MARIELA_APP_MONGO_PASSWORD no .env}
    volumes:
      - mongodb_data:/data/db
      # Etapa 28 — só executado pela imagem oficial na PRIMEIRA inicialização
      # (data directory vazio); nunca roda de novo num volume já existente.
      # Montado somente leitura — este container nunca deve escrever aqui.
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Etapa 27 — publicada só em loopback (127.0.0.1), nunca em todas as
      # interfaces: o serviço `api` NUNCA precisou desta publicação para
      # funcionar (alcança `mongodb` pelo nome do serviço, na rede interna do
      # Compose — ver `MONGODB_URI` abaixo). A publicação existe unicamente
      # para permitir `mongosh`/`mongodump`/Compass a partir do PRÓPRIO host
      # (ex.: backup manual, inspeção administrativa). Antes da Etapa 27,
      # publicar em todas as interfaces + Mongo sem autenticação deixava o
      # banco alcançável por qualquer processo que chegasse à rede do host —
      # o risco de maior severidade identificado naquela auditoria.
      # Autenticação (Etapa 28, ver `environment` acima) fecha a segunda
      # metade do mesmo risco: mesmo alguém alcançando esta porta pelo host
      # agora precisa de credencial válida.
      - "127.0.0.1:27017:27017"
    healthcheck:
      # Etapa 27 — sem isto, `api.depends_on` só esperava o CONTAINER do Mongo
      # iniciar, não o processo do banco ficar pronto para aceitar conexões;
      # combinado com o timeout curto do Mongoose (fail-fast deliberado, ver
      # `src/database/mongoose.config.ts`), a primeira subida a frio podia
      # gerar um ou mais crash-loops da `api` até o Mongo terminar de
      # inicializar o data directory (mitigado, não eliminado, por
      # `restart: unless-stopped`). Mesmo comando já usado no CI (Etapa 25).
      test: ["CMD", "mongosh", "--eval", "db.adminCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      # Etapa 27 — driver padrão (`json-file`) sem limite cresce
      # indefinidamente no disco do host ao longo do tempo; teto razoável
      # para um serviço de banco de dados de uma loja única.
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      # Etapa 27 — espera o Mongo estar de fato PRONTO (healthcheck acima),
      # não só com o container iniciado (ver comentário do `healthcheck` do
      # `mongodb`).
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Etapa 28 — usuário de APLICAÇÃO (readWrite só em `mariela`, criado
      # pelo script em ./docker/mongo-init na primeira subida), nunca o
      # usuário root do serviço `mongodb` acima. `authSource=mariela` porque
      # o usuário foi criado NAQUELE banco, não em `admin` (onde só o root
      # vive). Credenciais interpoladas do .env real do servidor — nunca
      # hardcoded aqui.
      MONGODB_URI: mongodb://${MARIELA_APP_MONGO_USER:?defina MARIELA_APP_MONGO_USER no .env}:${MARIELA_APP_MONGO_PASSWORD:?defina MARIELA_APP_MONGO_PASSWORD no .env}@mongodb:27017/mariela?authSource=mariela
      # Aponta para o serviço `evolution-api` desta mesma composição — só tem
      # efeito se EVOLUTION_API_KEY (segredo, vem do .env) também estiver
      # definida; caso contrário a integração de WhatsApp fica desabilitada
      # (ver `WhatsappService`/`configuration.ts`).
      EVOLUTION_API_URL: http://evolution-api:8080
    ports:
      # Etapa 27 — permanece publicada em todas as interfaces (diferente do
      # Mongo acima): é a ÚNICA forma de alcançar a API enquanto não existir
      # um reverse proxy na frente (fora do escopo desta etapa — ver
      # relatório). Quando o proxy existir, isto deve passar a ser só
      # "127.0.0.1:3000:3000" (ou nem publicado, se o proxy rodar na mesma
      # rede Docker) — documentado como pendência, não alterado agora.
      - "3000:3000"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Evolution API (Etapa Pré-22) — infraestrutura EXTERNA ao MARIELA, usada só
  # como cliente HTTP (ver `EvolutionApiProvider`). Postgres/Redis abaixo são
  # exigidos pela própria Evolution API (persistência de instâncias/sessões e
  # cache/fila internos) — NÃO são o futuro Redis do MARIELA (Etapa 17 do
  # roadmap geral): propositalmente isolados em rede/volumes próprios, nunca
  # reaproveitados pelo serviço `api` acima.
  #
  # Versão pinada em v2.3.7 (última estável antes da série 2.4.x, que passou a
  # exigir ativação de licença) — não usar `latest`. Reavaliar a versão junto
  # com a licença antes de qualquer upgrade (ver relatório da Etapa Pré-22).
  #
  # `profiles: [whatsapp]` — nenhum destes 3 serviços sobe com um `docker
  # compose up` comum (o comportamento existente de `mongodb`+`api` continua
  # idêntico ao de antes desta etapa). Para incluir o WhatsApp:
  #   docker compose --profile whatsapp up
  # ---------------------------------------------------------------------------
  evolution-postgres:
    image: postgres:15
    restart: unless-stopped
    profiles: ["whatsapp"]
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-net

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["whatsapp"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis_data:/data
    networks:
      - evolution-net

  evolution-api:
    # Namespace corrigido (auditoria pós-commit): `atendai/evolution-api` não
    # publica mais tags 2.x além de v2.2.3 — o projeto migrou para
    # `evoapicloud/evolution-api`, onde a tag v2.3.7 realmente existe.
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    profiles: ["whatsapp"]
    depends_on:
      - evolution-postgres
      - evolution-redis
    environment:
      SERVER_URL: http://localhost:8081
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env antes de subir --profile whatsapp}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-postgres:5432/evolution?schema=evolution_api
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/1
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      # Host 8081, nunca 8080: o dev server (Vite) do Backoffice já usa 8080.
      - "8081:8080"
    networks:
      - evolution-net
      - default

volumes:
  mongodb_data:
  evolution_postgres_data:
  evolution_redis_data:
  evolution_instances:

networks:
  evolution-net:
    # Rede própria da Evolution API (ela + seu Postgres/Redis internos) — o
    # serviço `api` do MARIELA fala com `evolution-api` pela rede `default`
    # (ver acima), nunca acessa `evolution-postgres`/`evolution-redis`
    # diretamente.
    driver: bridge
